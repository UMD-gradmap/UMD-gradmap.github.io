- date: October 7, 2026
  headline: Winter Workshop applications open
  shortdesc: We are excited to announce that applications are open for the Winter Workshop, which will take place from January 4-10, 2027. This is a free workshop for undergraduate students and recent graduates from U.S. institutions. We will debut our brand-new Code Lab Python programming platform at this year's workshop. [Apply here](https://tinyurl.com/gradmapww27) by November 25, 2026!

- date: April 17, 2026
  headline: GRAD-MAP awarded funds from UMD Do Good Institute
  shortdesc: We have recently been selected to receive funding from the Do Good Institute as part of their [Year 3 Campus Fund](https://https://dogood.umd.edu/news/245k-awarded-do-good-campus-fund). The funds will primarily be used to develop and open-source our new scientific Python programming lectures, called GRAD-MAP Code Lab.

- date: January 22, 2026
  headline: GRAD-MAP awarded funds from Maryland Space Grant Consortium
  shortdesc: We are pleased to announce that GRAD-MAP has been awarded funds as part of a cost-share agreement between the University of Maryland and the [Maryland Space Grant Consortium](https://https://md.spacegrant.org/). The funds will primarily be used to provide a stipend and housing for three Summer Scholars in 2026, who will conduct research in the space sciences as MDSGC Scholars.

- date: October 1, 2025
  headline: Winter Workshop applications open
  shortdesc: We are thrilled to open applications for our one-week immersive online Winter Workshop, offered at no cost and open to undergraduate students at U.S. institutions who are interested in physics or astronomy. Learn coding, research methods, and professional development while building community with graduate student mentors. The Winter Workshop application is currently open and is available here [Application Link](https://docs.google.com/forms/d/e/1FAIpQLSfy_u1e7OwrSCHY4m0cpK2xCMaoRVg1g3fDVXqqHL55feY3wg/viewform). The deadline for applications is on November 21, 2026.

- date: August 20, 2025
  headline: GRAD-MAP featured by CMNS
  shortdesc: We’re excited to share that GRAD-MAP was [recently featured by the College of Computer, Mathematical and Natural Sciences](https://cmns.umd.edu/news-events/news/grad-map-students-mentors-learn-each-other)! The article highlights how our program connects undergraduates from across the country—especially those from institutions with limited research opportunities—with UMD mentors to explore physics and astronomy through our Winter Workshop and Summer Scholars programs. It also showcases the collegiality between students, mentors, and faculty that continues to make GRAD-MAP a model for collaborative research training at Maryland.

- date: June 9, 2025
  headline: Welcome to UMD, 2025 summer scholars!
- date: Mar 3, 2025
  headline: Summer scholar program applications are open! Application deadline is on March 21, 2025.
  shortdesc: UMD GRAD-MAP is now accepting applications for our summer scholars program! The program provides a 9-week enhanced summer research experience in physics or astrophysics at UMD. The internship will be from June 9th - August 8th, 2025 and will be paid ($6300 stipend plus the option of on-campus housing), and open only to YOU as Winter Workshop alumni! Applications are due on Friday, March 21, by 5:00pm EST. If you have trouble meeting this deadline, let us know! (Application link - https://forms.gle/ZKDPxDpY4uQv2nB88)
- date: October 21, 2024
  headline: Winter workshop applications are open! Application deadline is on December 1, 2025.
  shortdesc: UMD GRAD-MAP is now accepting applications for our winter workshop! Applicants who have little to no experience in Python are strongly encouraged to apply. Students accepted to our winter workshop will have the opportunity to apply for a summer internship! If you have any questions, you may reach out to us at grad-map@umd.edu. (Application link - bit.ly/UMDGRADMAPww2025)
- date: June 3, 2024
  headline: Welcome to UMD 2024 summer scholars!


 
